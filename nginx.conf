server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Serve the generic-resource-ui app
    location /ui/generic-resource/ {
        alias /usr/share/nginx/html/ui/generic-resource/;
        try_files $uri $uri/ /ui/generic-resource/index.html;
    }

    # Handle SPA routing for the app
    location /ui/generic-resource {
        rewrite ^/ui/generic-resource$ /ui/generic-resource/ permanent;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
